[package]
name = "m5-tab5"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "m5-tab5"
harness = false # no test harness on target

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.53"
m5-common = { path = "../../common" }

[build-dependencies]
embuild = "0.33"
