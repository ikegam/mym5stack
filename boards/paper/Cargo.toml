[package]
name = "m5-paper"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "m5-paper"
harness = false # no test harness on target

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "1"
log = "0.4"
esp-idf-svc = "0.53"
embedded-graphics = "0.8"
m5-common = { path = "../../common" }

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.14" }

[build-dependencies]
embuild = "0.33"
